# Three patients and autoheal. Each patient is healthy until a test trips its
# gate, so the stack comes up cleanly and nothing is wrong until the test says
# it is.
#
# None declares a healthcheck: the patient image carries its own, so every
# scenario probes on the same interval and a fixture cannot forget one.
services:
  # Labelled and made sick by the test: autoheal's to restart.
  sick:
    image: autoheal-patient:integration
    labels:
      autoheal: "true"

  # The negative case: made sick in exactly the same way, but unlabelled.
  sick-unlabelled:
    image: autoheal-patient:integration

  # Labelled but never made sick: the label alone must not be enough.
  well:
    image: autoheal-patient:integration
    labels:
      autoheal: "true"

  autoheal:
    image: autoheal:integration
    environment:
      AUTOHEAL_INTERVAL: "1"
      AUTOHEAL_START_PERIOD: "0"
      LOG_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
