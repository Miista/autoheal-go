# One patient and an autoheal that gives up after two restarts in a row.
#
# The threshold is low on purpose: the scenarios below wait for autoheal to
# reach it, and three restarts at a one-second poll is a long time to sit in a
# test for no extra confidence.
services:
  looper:
    image: autoheal-patient:integration
    labels:
      autoheal: "true"

  autoheal:
    image: autoheal:integration
    environment:
      AUTOHEAL_INTERVAL: "1"
      AUTOHEAL_START_PERIOD: "0"
      # From .env, which the test reads too: the number it expects and the
      # number autoheal is given must be the same one.
      AUTOHEAL_CRASHLOOP_STRIKES: "${CRASHLOOP_STRIKES}"
      # Restarting is not what these scenarios are timing, so do not wait ten
      # seconds for a container that has nothing to flush.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "1"
      LOG_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
